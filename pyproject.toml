[project]
name = "bank-marketing-allocation"
version = "0.1.0"
description = "Decision Science project: who to contact under a fixed contact-capacity budget"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data layer
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    # predictive layer
    "scikit-learn>=1.5",
    "mlflow>=2.16",
    # prescriptive layer
    "pulp>=2.9",
    # visualisation
    "matplotlib>=3.9",
    "seaborn>=0.13",
    # serving layer
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bank_marketing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
